<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>Blogger</title>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
	<script src='java.js'></script>
</head>
<body>
	<div class="forum">
		<a href="../../index.html#works" class="back-link">&larr; Back to Portfolio</a>
		<h1 id="top"></h1>

		<p class="label">Topic</p>
		<div id="topic" class="post"></div>

		<p class="label">Reply 1</p>
		<div id="reply1" class="post reply"></div>

		<p class="label">Reply 2</p>
		<div id="reply2" class="post reply"></div>

		<div class="write-box">
			<textarea name="message" id="message" placeholder="Write your message here..."></textarea>
			<div class="buttons">
				<button type="button" class="post-btn" onclick="postFunction()">Post</button>
				<button type="button" class="clear-btn" onclick="clearFunction()">Clear</button>
			</div>
		</div>
	</div>
</body>
</html>
