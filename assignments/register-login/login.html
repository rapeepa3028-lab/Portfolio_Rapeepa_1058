<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Login</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="text/javascript" src="login.js"></script>
	</head>
	<body>
		<a href="../../index.html#works" class="back-link">&larr; Back to Portfolio</a>
		<form name="myLogin" id="myLogin">
			<fieldset>
				<legend>Login</legend>
				Username:
				<input type="text" name="username" id="username" required>
				<br>
				Password:
				<input type="password" name="password" required>
				<br>
				<input type="submit" value="Login" id="loginBtn">
				<input type="reset" value="Clear" id="clearBtn">
				<p class="switch-link">No account yet? <a href="register.html">Register</a></p>
			</fieldset>
		</form>
	</body>
</html>
