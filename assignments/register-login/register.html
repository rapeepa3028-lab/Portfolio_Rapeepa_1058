<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Register</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="text/javascript" src="register.js"></script>
	</head>
	<body>
		<a href="../../index.html#works" class="back-link">&larr; Back to Portfolio</a>
		<form name="myRegister" id="myRegister" action="login.html">
			<fieldset>
				<legend>Register</legend>
				<span>* require</span> <br>
				<span id="errormsg"></span> <br>
				First name*:
				<input type="text" name="firstname" required>
				Last name*:
				<input type="text" name="lastname">
				<br>
				Gender*:
				<input type="radio" name="gender" value="male">Male
				<input type="radio" name="gender" value="female">Female
				<input type="radio" name="gender" value="other">Other
				<br>
				Birthday*:
				<input type="date" name="bday" value="">
				<br>
				Email address*:
				<input type="email" name="email">
				<br>
				Username*:
				<input type="text" name="username">
				<br>
				Password*:
				<input type="password" name="password" required>
				<br>
				Retype Password*:
				<input type="password" name="password" required>
				<br>
				<input type="submit" value="Register" id="registerBtn">
				<input type="reset" value="Reset" id="resetBtn">
				<p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
			</fieldset>
		</form>
	</body>
</html>
