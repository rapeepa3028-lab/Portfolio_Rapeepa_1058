<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Square game</title>
		<script type="text/javascript" src="game.js"></script>
		<link rel="stylesheet" type="text/css" href="game.css">
	</head>
	<body>
		<a href="../../index.html#works" class="back-link">&larr; Back to Portfolio</a>
		<!-- these codes were adapted from https://courses.cs.washington.edu/courses/cse154/17sp/lecture/more-dom/code/squares.html  -->

		<fieldset>
			<legend>Control</legend>
			<label for="numbox">Number of box: </label>
			<input type="text" name="numbox" id="numbox" placeholder="e.g. 10">
			<select name="color" id="color">
				<option value="maroon">Maroon</option>
				<option value="lightgreen">Lightgreen</option>
				<option value="magenta">Magenta</option>
			</select>
			<button id="start">Start</button>
			<div id="timerClock"> Timer:
				<div id="clock"></div>
			</div>
		</fieldset>

		<div id="container">
			<div id="layer"></div>
		</div>

		<p class="credit">Adapted from <a href="https://courses.cs.washington.edu/courses/cse154/17sp/lecture/more-dom/code/squares.html" target="_blank">University of Washington CSE 154 - Squares example</a></p>
	
	</body>
</html>
